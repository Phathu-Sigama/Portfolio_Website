<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS logo – 3D test</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.2.0/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0c1a; }
    model-viewer { width: 320px; height: 320px; background: transparent; }
  </style>
</head>
<body>
  <model-viewer src="/logo.glb" alt="PS logo"
    auto-rotate auto-rotate-delay="0" rotation-per-second="60deg"
    camera-controls disable-zoom disable-pan
    camera-orbit="0deg 80deg auto"
    interaction-prompt="none"
    exposure="1.1">
  </model-viewer>
</body>
</html>
